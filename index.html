<!DOCTYPE html>
<html>


    <head>
        <meta charset="UTF-8">
        <title>Calendar</title>
        <link rel="stylesheet" type="text/css"  href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>


    <body >
        <div class="contenedor">
            <!-- Hora y clima -->
            <div class="pantalla" style="text-align: center;" id="pantalla-inicio">
                <h1 id="time">1:20PM</h1>
                <h2 id="date">21 Jul 2026</h2>
                <div class="fila" style="text-align: center;">
                    <h1 id="condition">--</h1>
                    <p id="temp">--ºC</p>
                </div>
            </div>



            <!--Calendario -->
            <iframe class="pantalla" id="pantalla-calendario"
                    sandbox="allow-scripts allow-same-origin"
                    frameborder="0" scrolling="no"></iframe>


            <!--To-Do -->
            <div class="pantalla" id="pantalla-todo"><h1>To-do</h1></div>


            <!--Habitos -->

            <div class="pantalla" id="pantalla-habitos"><h1>Hábitos</h1></div>

            <!--barra inferior -->
            <div class="barra">
                <span></span><span></span><span></span><span></span>
            </div>


        </div>
        <div class="botones">
            <button data-id="b1" class="boton"></button>
            <button data-id="b2" class="boton"></button>
            <button data-id="b3" class="boton"></button>
            <button data-id="b4" class="boton"></button>
        </div>

        <script src="calendar.js"></script>
        <script src="tiempo.js"></script>
        <script src="script.js"></script>

    </body>

</html>

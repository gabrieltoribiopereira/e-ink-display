<!DOCTYPE html>
<html>


    <head>
        <meta charset="UTF-8">
        <title>Display</title>

        <link rel="stylesheet" type="text/css"  href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="constancia.css">
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head>


    <body >

        <!-- pantalla login -->
        <div id="login" hidden>
            <form id="login-form">
                <h1>e-ink</h1>
                      <p class="sub">Panel de control</p>

                      <label for="email">Email</label>
                      <input id="email" type="email" placeholder="nombre@correo.com"
                             autocomplete="username" required />

                      <label for="password">Contraseña</label>
                      <input id="password" type="password" placeholder="••••••••"
                             autocomplete="current-password" required />

                      <button id="btn-login" type="submit">Entrar</button>
                      <p id="login-error" role="alert"></p>
            </form>
        </div>


        <div id="dashboard" hidden>
        <div class="contenedor">
            <!-- Hora y clima -->
            <div class="pantalla" style="text-align: center;" id="pantalla-inicio">
                <h1 id="time">1:20PM</h1>
                <h2 id="date">21 Jul 2026</h2>
                <div class="fila" style="text-align: center;">
                    <h1 id="condition">--</h1>
                    <p id="temp">--ºC</p>
                </div>
            </div>



            <!--Calendario -->
            <iframe class="pantalla" id="pantalla-calendario"
                    sandbox="allow-scripts allow-same-origin"
                    frameborder="0" scrolling="no"></iframe>


            <!--To-Do -->
            <div class="pantalla" id="pantalla-todo">
                <h1>To-do</h1>
                <div id="lista-tareas"></div>
            </div>


            <!--Habitos -->
            <div class="pantalla" id="pantalla-habitos">
                <div id="constancia"></div>
            </div>

            <!--barra inferior -->
            <div class="barra">
                <span></span><span></span><span></span><span></span>
            </div>



        <!--botones mejor no tocar porque esta bien-->
        </div>
        <div class="botones">
            <button data-id="b1" class="boton"></button>
            <button data-id="b2" class="boton"></button>
            <button data-id="b3" class="boton"></button>
            <button data-id="b4" class="boton"></button>
        </div>
        <!-- fuera de .contenedor: el server captura solo .contenedor, asi que
             este boton no aparece en el e-ink -->
        <button id="btn-logout" type="button">Cerrar sesión</button>
        </div>

        <script src="config.js"></script>
        <script src="auth.js"></script>
        <script src="calendar.js"></script>
        <script src="tiempo.js"></script>
        <script src="script.js"></script>
        <script src="to-do.js"></script>
        <script type="module" src="constancia.js"></script>
    </body>

</html>
